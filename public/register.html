<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация — CHEAT.GG</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-logo">CHEAT<span>.GG</span></div>
    <p class="auth-tagline">Создайте аккаунт и начните играть</p>

    <div class="auth-card">
      <h1>Регистрация</h1>

      <div id="alert" class="alert alert-error"></div>

      <form class="auth-form" id="reg-form" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="username">Никнейм</label>
          <input class="form-input" type="text" id="username"
            placeholder="Минимум 3 символа" maxlength="32" autocomplete="off" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Пароль</label>
          <input class="form-input" type="password" id="password"
            placeholder="Минимум 6 символов" autocomplete="new-password" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="password2">Подтвердить пароль</label>
          <input class="form-input" type="password" id="password2"
            placeholder="Повторите пароль" autocomplete="new-password" required />
        </div>

        <button class="btn btn-primary btn-lg" type="submit" id="submit-btn" style="margin-top:4px">
          СОЗДАТЬ АККАУНТ
        </button>
      </form>

      <div class="auth-footer">
        Уже есть аккаунт? <a href="/">Войти</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('reg-form');
    const alertEl = document.getElementById('alert');
    const btn = document.getElementById('submit-btn');

    function showError(msg) {
      alertEl.textContent = msg;
      alertEl.className = 'alert alert-error show';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.className = 'alert alert-error';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;

      if (password !== password2) {
        return showError('Пароли не совпадают');
      }

      btn.disabled = true;
      btn.textContent = 'СОЗДАНИЕ...';

      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (data.success) {
        btn.textContent = '✓ ГОТОВО';
        window.location.href = data.redirect;
      } else {
        showError(data.error || 'Ошибка регистрации');
        btn.disabled = false;
        btn.textContent = 'СОЗДАТЬ АККАУНТ';
      }
    });
  </script>
</body>
</html>

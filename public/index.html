<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHEAT.GG — HvH Matchmaking</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-logo">CHEAT<span>.GG</span></div>
    <p class="auth-tagline">Соревновательный матчмейкинг для HvH игроков</p>

    <div class="auth-card">
      <h1>Войти</h1>

      <div id="alert" class="alert alert-error"></div>

      <form class="auth-form" id="login-form" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="username">Никнейм</label>
          <input class="form-input" type="text" id="username" placeholder="Введите никнейм" autocomplete="off" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Пароль</label>
          <input class="form-input" type="password" id="password" placeholder="Введите пароль" autocomplete="off" required />
        </div>

        <button class="btn btn-primary btn-lg" type="submit" id="submit-btn" style="margin-top:4px">
          ВОЙТИ
        </button>
      </form>

      <div class="auth-footer">
        Нет аккаунта? <a href="/register.html">Зарегистрироваться</a>
      </div>
    </div>
  </div>

  <script>
    // Redirect if already logged in
    fetch('/api/me').then(r => {
      if (r.ok) return r.json();
    }).then(u => {
      if (u) window.location.href = u.setup_done ? '/dashboard.html' : '/setup.html';
    }).catch(() => {});

    const form = document.getElementById('login-form');
    const alert = document.getElementById('alert');
    const btn = document.getElementById('submit-btn');

    function showError(msg) {
      alert.textContent = msg;
      alert.className = 'alert alert-error show';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'ВХОД...';
      alert.className = 'alert alert-error';

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        })
      });

      const data = await res.json();

      if (data.success) {
        btn.textContent = '✓ УСПЕШНО';
        window.location.href = data.redirect;
      } else {
        showError(data.error || 'Ошибка входа');
        btn.disabled = false;
        btn.textContent = 'ВОЙТИ';
      }
    });
  </script>
</body>
</html>
